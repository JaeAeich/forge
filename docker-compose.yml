# Full stack on one machine:   docker compose up -d --build   (UI on http://localhost:8000)
# More workers:                docker compose up -d --scale worker=4
# Ollama runs on the host by default (Metal on macOS); on a Linux GPU box add `--profile ollama`
# and set FORGE_OLLAMA_URL=http://ollama:11434.
name: forge

x-forge: &forge
  build: .
  image: forge:latest
  restart: unless-stopped
  environment: &env
    FORGE_DATABASE_URL: postgresql://forge:forge@postgres:5432/forge
    FORGE_NATS_URL: nats://nats:4222
    FORGE_REGISTRY: localhost:5000 # pushed/pulled by the host's Docker daemon
    FORGE_OLLAMA_URL: ${FORGE_OLLAMA_URL:-http://host.docker.internal:11434}
    FORGE_MODEL: ${FORGE_MODEL:-qwen2.5-coder:14b}
    FORGE_LOG_FORMAT: json
    FORGE_DATA: /data
  extra_hosts: ["host.docker.internal:host-gateway"]
  depends_on:
    postgres: { condition: service_healthy }
    nats: { condition: service_healthy }

services:
  api:
    <<: *forge
    command: ["forge", "api", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # the Environments page starts stacks on this host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *forge
    command: ["forge", "worker"]
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "4", memory: 4g }
    stop_grace_period: 60s # SIGTERM -> finish or hand back running jobs (FORGE_SHUTDOWN_GRACE_SECONDS)
    environment:
      <<: *env
      FORGE_SHUTDOWN_GRACE_SECONDS: "45"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # sandboxes are sibling containers
      - repos:/data

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=512MB"]
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    volumes: [natsdata:/data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 10

  registry:
    image: registry:2
    restart: unless-stopped
    ports: ["127.0.0.1:5000:5000"]
    volumes: [registry:/var/lib/registry]

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes:
  pgdata:
  natsdata:
  registry:
  repos:
  ollama:
