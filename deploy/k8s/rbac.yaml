# The API (environments) and workers (agent sandboxes) create Sandboxes and exec into their pods.
# That's all they can do: no Docker socket, no privileged pods, nothing outside this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forge-sandboxes
rules:
  - apiGroups: [sandbox.forge.dev]
    resources: [sandboxes, sandboxsnapshots]
    verbs: [get, list, watch, create, delete, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forge-sandboxes
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: forge-sandboxes }
subjects:
  - { kind: ServiceAccount, name: forge }
