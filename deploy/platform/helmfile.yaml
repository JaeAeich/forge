# Cluster operators forge builds on, installed once per cluster: `helmfile -f deploy/platform/helmfile.yaml apply`.
# Then `kubectl apply -k deploy/operator` and `kubectl apply -k deploy/k8s`.
#
# Also needed, and usually provided by the cloud: a CSI driver with VolumeSnapshot support plus a
# VolumeSnapshotClass (EBS, PD, Azure Disk, Ceph RBD, ...), and a sandbox runtime class (gVisor or Kata).
repositories:
  - name: cnpg
    url: https://cloudnative-pg.github.io/charts
  - name: nats
    url: https://nats-io.github.io/k8s/helm/charts
  - name: kedacore
    url: https://kedacore.github.io/charts
  - name: piraeus
    url: https://piraeus.io/helm-charts

releases:
  # Postgres operator: runs the `forge-db` Cluster in deploy/k8s/postgres.yaml
  - name: cnpg
    namespace: cnpg-system
    chart: cnpg/cloudnative-pg
    version: ~0.29.0

  # NATS with JetStream, 3 nodes so job announcements survive losing one
  - name: nats
    namespace: forge
    chart: nats/nats
    version: ~2.15.0
    values:
      - config:
          cluster: { enabled: true, replicas: 3 }
          jetstream:
            enabled: true
            fileStore: { pvc: { size: 20Gi } }
        podTemplate:
          topologySpreadConstraints:
            kubernetes.io/hostname: { maxSkew: 1, whenUnsatisfiable: DoNotSchedule }

  # NACK: JetStream streams as Kubernetes resources (deploy/k8s/nats.yaml declares the job stream)
  - name: nack
    namespace: forge
    chart: nats/nack
    version: ~0.35.0
    needs: [forge/nats]
    values:
      - jetstream: { nats: { url: nats://nats:4222 } }
        namespaced: true

  # KEDA: scales workers on the job backlog (deploy/k8s/worker.yaml)
  - name: keda
    namespace: keda
    chart: kedacore/keda
    version: ~2.21.0

  # VolumeSnapshot CRDs + controller. Most managed clusters ship them; set to true if yours doesn't.
  - name: snapshot-controller
    namespace: kube-system
    chart: piraeus/snapshot-controller
    version: ~5.3.0
    installed: false
