# Two replicas with leader election: a standby takes over within seconds if the leader dies.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-sandbox-operator
spec:
  replicas: 2
  selector:
    matchLabels: { app: forge-sandbox-operator }
  template:
    metadata:
      labels: { app: forge-sandbox-operator }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: forge-sandbox-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: manager
          image: forge-operator
          args: ["--leader-elect", "--zap-encoder=json"]
          ports:
            - { name: metrics, containerPort: 8080 }
            - { name: probes, containerPort: 8081 }
          livenessProbe:
            httpGet: { path: /healthz, port: probes }
          readinessProbe:
            httpGet: { path: /readyz, port: probes }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: forge-sandbox-operator
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app: forge-sandbox-operator }
